# 🚄 Railway.app Configuration
# Deployment configuration for Railway platform

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
# ✅ RAILWAY FIX: /health é melhor que /ping para healthcheck
restartPolicyType = "ON_FAILURE" 
restartPolicyMaxRetries = 5
# Debug endpoints available: 
# - /health (main healthcheck)
# - /railway-health (simple healthcheck)
# - /debug (comprehensive system info)
# - /status (basic status)
# - /ping (alternative healthcheck)

[env]
# Railway auto-provides PORT, but we can set defaults
PYTHONUNBUFFERED = "1"
PYTHONDONTWRITEBYTECODE = "1"
RAILWAY_FAST_START = "true"

[build.args]
# Build arguments for Railway
BUILDKIT_INLINE_CACHE = "1"