# 🚄 Railway.app Configuration
# Deployment configuration for Railway platform

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.railway.fixed"

[deploy]
healthcheckPath = "/emergency"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[env]
# Railway auto-provides PORT, but we can set defaults
PYTHONUNBUFFERED = "1"
PYTHONDONTWRITEBYTECODE = "1"
RAILWAY_FAST_START = "true"

[build.args]
# Build arguments for Railway
BUILDKIT_INLINE_CACHE = "1"