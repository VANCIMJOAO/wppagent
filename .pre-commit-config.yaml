# 🎨 Pre-commit Hooks Configuration
# WhatsApp Agent - Quality Gates Automáticos

default_language_version:
  python: python3.13

repos:
  # 🎨 Code Formatting
  - repo: https://github.com/psf/black
    rev: 23.9.1
    hooks:
      - id: black
        language_version: python3.13
        args: [--line-length=88]

  # 📝 Import Sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        args: ["--profile", "black", "--line-length", "88"]

  # 🔍 Linting
  - repo: https://github.com/pycqa/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        args: [--max-line-length=88, --extend-ignore=E203,W503, --per-file-ignores=__init__.py:F401]
        additional_dependencies: [flake8-docstrings, flake8-bugbear, flake8-comprehensions]

  # 🏷️ Type Checking - Temporarily disabled
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.6.0
  #   hooks:
  #     - id: mypy
  #       additional_dependencies: [types-all, types-requests, types-redis]
  #       args: [--ignore-missing-imports, --strict-optional]
  #       exclude: ^tests/

  # 🛡️ Security
  - repo: https://github.com/pycqa/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        args: [-r, app/, -f, json, -ll]
        exclude: tests/

  # 🔐 Secrets Detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package.lock.json

  # 📄 YAML/JSON Validation
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: pretty-format-json
        args: [--autofix, --indent=2]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-case-conflict
      - id: check-executables-have-shebangs

  # 🐳 Dockerfile Linting
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        args: [--ignore, DL3008, --ignore, DL3009]

  # 📚 Documentation
  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        args: [--convention=google]
        exclude: tests/

  # 🔒 Dependency Security Check
  - repo: local
    hooks:
      - id: safety-check
        name: Safety Check
        entry: safety check
        language: system
        types: [python]
        pass_filenames: false

      - id: pip-audit
        name: Pip Audit
        entry: pip-audit
        language: system
        types: [python]
        pass_filenames: false

  # 📊 Code Quality Metrics
  - repo: local
    hooks:
      - id: complexity-check
        name: Complexity Check
        entry: python -m flake8 --select=C901 --max-complexity=10
        language: system
        types: [python]

      - id: test-coverage-check
        name: Test Coverage Check
        entry: python scripts/check_coverage.py
        language: system
        types: [python]
        pass_filenames: false
        stages: [commit]

  # 🧪 Quick Tests
  - repo: local
    hooks:
      - id: quick-tests
        name: Quick Unit Tests
        entry: python -m pytest tests/unit/ -x --tb=short
        language: system
        types: [python]
        pass_filenames: false
        stages: [push]

  # 🔍 SQL Linting (se aplicável) - Temporarily disabled
  # - repo: https://github.com/sqlfluff/sqlfluff
  #   rev: 2.3.2
  #   hooks:
  #     - id: sqlfluff-lint
  #       additional_dependencies: [sqlfluff-templater-jinja]
  #       args: [--dialect, postgres]

  # 🌐 Markdown Linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.37.0
    hooks:
      - id: markdownlint
        args: [--fix]

  # 🎯 Custom Quality Gates
  - repo: local
    hooks:
      - id: observability-validation
        name: Observability Stack Validation
        entry: python scripts/validate_observability_config.py
        language: system
        files: ^(app/monitoring/|app/observability/|config/).*\.py$
        pass_filenames: false

      - id: security-headers-check
        name: Security Headers Check
        entry: python scripts/check_security_headers.py
        language: system
        files: ^app/.*\.py$
        pass_filenames: false

      - id: api-contract-validation
        name: API Contract Validation
        entry: python scripts/validate_api_contracts.py
        language: system
        files: ^app/routes/.*\.py$
        pass_filenames: false

# 🎛️ CI-specific configuration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: [safety-check, pip-audit, quick-tests]
  submodules: false
