[pytest]
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test* *Test
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --asyncio-mode=auto
    --cov=app
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-branch
asyncio_mode = auto

# Performance test configuration
# Use optimized performance tests to avoid timeouts
# Original test_performance.py can cause timeouts
# Use test_performance_lightweight.py or test_performance_optimized.py instead

markers =
    unit: Unit tests
    integration: Integration tests
    load: Load/Performance tests
    e2e: End-to-end tests
    critical: Critical functionality tests
    slow: Slow running tests
    auth: Authentication tests
    api: API tests
    database: Database tests
    whatsapp: WhatsApp related tests
    relationships: Database relationship tests
    transactions: Database transaction tests
    performance: Performance tests (timeout-safe optimized versions)
    resilience: Resilience tests
    security: Security tests
    webhook: Webhook tests
    business: Business logic tests
    edge_cases: Edge case tests
    meta_api: Meta API tests
    cache: Cache tests
    real: Real system tests
    conversation: Conversation tests
    e2e_real: Real end-to-end tests
    timeout: Tests with custom timeout configuration
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
